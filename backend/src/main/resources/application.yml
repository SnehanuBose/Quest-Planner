server:
  port: ${PORT:8080}

spring:
  application:
    name: whiteboard-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-water-az6h8efq-pooler.c-3.ap-southeast-1.aws.neon.tech/whiteboard-db?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:whiteboard-db_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_YTh2kebS1MNn}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600

logging:
  level:
    com.whiteboard.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
